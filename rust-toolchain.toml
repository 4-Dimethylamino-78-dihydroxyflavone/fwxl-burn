# Tracks the current stable release. The minimum supported Rust version is
# 1.92 (set by `ort` 2.0.0-rc.15; see `rust-version` in Cargo.toml).
#
# This file used to pin 1.96.0, because ort-sys 2.0.0-rc.12 could not build on
# Cargo 1.100's new build-directory layout. ort 2.0.0-rc.14 fixed that, so the
# pin is gone.
[toolchain]
channel = "stable"

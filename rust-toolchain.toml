# Pinned on purpose -- do not bump past 1.99 without also upgrading `ort`.
#
# Cargo 1.100 changed the build-directory layout (one extra level under
# target/<profile>/build). The build script of ort-sys 2.0.0-rc.12 locates the
# output directory by counting path components up from OUT_DIR, so on 1.100+
# it panics while copying the ONNX Runtime CUDA provider libraries:
#
#   ort-sys-2.0.0-rc.12/build/dynamic_link.rs: called `Result::unwrap()` on an
#   `Err` value: Os { kind: NotFound, .. }
#
# ort 2.0.0-rc.14 fixes this, but it also moves ONNX Runtime 1.24 -> 1.31,
# raises the MSRV to 1.92 and changes the session API. That upgrade has to be
# validated against a real CUDA 12 / cuDNN 9 GPU before it lands; until then
# this pin keeps every checkout building with the compiler the GPU path was
# verified on. rustup installs this toolchain automatically.
[toolchain]
channel = "1.96.0"
